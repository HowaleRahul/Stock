<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Dashboard — Technical Setups</title>
    <meta name="description" content="Real-time technical analysis dashboard with MA Crossover, RSI, MACD, Bollinger Bands, and Support/Resistance breakout setups.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-bar__left">
            <div class="top-bar__brand">
                <h1>📈 AI Trading</h1>
            </div>
            <nav class="top-nav">
                <button id="nav-dashboard" class="nav-btn active">Dashboard</button>
                <button id="nav-portfolio" class="nav-btn">Portfolio</button>
            </nav>
            <div class="search-container" id="search-container">
                <div class="search-input-wrapper">
                    <input type="text" id="ticker-search" class="ticker-search" placeholder="Search symbol..." autocomplete="off" spellcheck="false">
                    <button id="search-btn" class="search-btn" title="Search">🔍</button>
                    <ul id="search-suggestions" class="search-suggestions"></ul>
                </div>
            </div>
            <!-- Hidden fallback for legacy logic -->
            <select id="ticker-select" class="ticker-select hidden" style="display: none;"></select>
        </div>

        <div class="top-bar__center">
            <div class="timeframe-toolbar" id="timeframe-toolbar">
                <button class="tf-btn" data-tf="1m">1m</button>
                <button class="tf-btn" data-tf="2m">2m</button>
                <button class="tf-btn" data-tf="3m">3m</button>
                <button class="tf-btn" data-tf="4m">4m</button>
                <button class="tf-btn" data-tf="5m">5m</button>
                <button class="tf-btn" data-tf="10m">10m</button>
                <button class="tf-btn" data-tf="15m">15m</button>
                <button class="tf-btn" data-tf="30m">30m</button>
                <button class="tf-btn" data-tf="1h">1H</button>
                <button class="tf-btn" data-tf="2h">2H</button>
                <button class="tf-btn" data-tf="3h">3H</button>
                <button class="tf-btn active" data-tf="1d">1D</button>
                <button class="tf-btn" data-tf="1wk">1W</button>
                <button class="tf-btn" data-tf="1mo">1M</button>
            </div>
        </div>

        <div class="top-bar__right">
            <select id="market-mode-select" class="market-mode-select" title="Market Region">
                <option value="india" selected>🇮🇳 IND</option>
                <option value="global">🇺🇸 US</option>
                <option value="all">🌐 ALL</option>
            </select>
            <span id="last-updated" class="last-updated"></span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard" id="dashboard-view">
        <!-- Chart Area -->
        <section class="chart-area" id="chart-area">
            <div id="price-chart" class="chart-container" style="flex: 1 1 auto; min-height: 200px;">
                <div id="price-legend" class="chart-legend"></div>
            </div>
            <div class="pane-resizer" id="resizer-1"></div>
            <div id="rsi-chart" class="indicator-pane" style="height: 150px; flex: 0 0 150px;">
                <div id="rsi-legend" class="chart-legend"></div>
            </div>
            <div class="pane-resizer" id="resizer-2"></div>
            <div id="macd-chart" class="indicator-pane" style="height: 150px; flex: 0 0 150px;">
                <div id="macd-legend" class="chart-legend"></div>
            </div>
            <div id="loading-overlay" class="loading-overlay">
                <div class="spinner"></div>
                <p>Analyzing...</p>
            </div>
        </section>

        <!-- Signals Panel -->
        <aside class="signals-panel">
            <h2 class="signals-panel__title">Setup Signals</h2>
            
            <div id="ensemble-badge" class="ensemble-badge hidden">
                <div class="ensemble-header">
                    <span id="ensemble-signal">AI Prediction</span>
                    <span id="ensemble-prob"></span>
                </div>
                <div class="ensemble-details">
                    <p id="ensemble-drivers"></p>
                    <p id="ensemble-alt"></p>
                </div>
            </div>
            
            <div id="regime-badge" class="regime-badge hidden">
                <span id="regime-text">Detecting Regime...</span>
            </div>
            
            <details class="setup-filters">
                <summary>
                    <span class="summary-title">⚙️ Filter Setups</span>
                    <span class="summary-icon">▼</span>
                </summary>
                <div class="setup-toggles">
                    <label class="toggle-all-label"><input type="checkbox" id="toggle-all" checked> Select All</label>
                    <div id="setup-checkboxes" class="setup-checkboxes">
                        <!-- Populated via JS -->
                    </div>
                </div>
            </details>
            
            <div id="signals-summary" class="signals-summary hidden">
                <!-- Summary tallies injected here -->
            </div>
            
            <div id="signals-container" class="signals-container">
                <div class="empty-state">
                    <p>Select a symbol to view analysis</p>
                </div>
            </div>
        </aside>
    </main>

    <main class="portfolio-view hidden" id="portfolio-view">
        <div id="portfolio-content" class="portfolio-container">
            <!-- Rendered by portfolio.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Charts powered by <a href="https://www.tradingview.com" target="_blank" rel="noopener">TradingView</a> Lightweight Charts</p>
    </footer>

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="app.js"></script>
    <script type="module">
        import { fetchPortfolioData, renderPortfolio } from './portfolio.js';
        
        document.getElementById('nav-dashboard').addEventListener('click', () => {
            document.getElementById('nav-dashboard').classList.add('active');
            document.getElementById('nav-portfolio').classList.remove('active');
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('portfolio-view').classList.add('hidden');
        });
        
        document.getElementById('nav-portfolio').addEventListener('click', async () => {
            document.getElementById('nav-portfolio').classList.add('active');
            document.getElementById('nav-dashboard').classList.remove('active');
            document.getElementById('portfolio-view').classList.remove('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
            
            const data = await fetchPortfolioData();
            renderPortfolio(data);
        });
    </script>
</body>
</html>
